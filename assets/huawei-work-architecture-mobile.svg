<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1460" viewBox="0 0 680 1460" role="img" aria-labelledby="title desc">
<title id="title">Storage platform architecture — mobile view</title>
<desc id="desc">Upper-layer object, file, block, and KV services sit above the scope of responsibility. Within the boundary: a core software platform with persistent storage and distributed memory pools; compute–storage disaggregation, separation of data and control planes, and hardware–software co-design; hardware including NICs, SSD controllers, NPUs and CPUs; and DRAM, NAND flash, HDDs, and tape. Reliability, performance, scalability, and cost efficiency guide the design.</desc>
